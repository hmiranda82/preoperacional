packages:
  - 'backend'
  - 'frontend'
  - 'app-conductores'

overrides:
  body-parser: ^2.3.0
  multer: ^2.2.0
  dompurify: ^3.4.13
  postcss: ^8.5.23
  nanoid: ^3.3.18
  tmp: ^0.2.6
  uuid: ^11.1.1
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@3: ^3.0.6
  brace-expansion@5: ^5.0.9

allowBuilds:
  '@nestjs/core': set this to true or false
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  bcrypt: set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  unrs-resolver: set this to true or false
  vue-demi: set this to true or false

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'bcrypt'
  - 'esbuild'
  - 'prisma'
  - 'unrs-resolver'
  - 'vue-demi'
