packages:
  - 'backend'
  - 'frontend'
  - 'app-conductores'

overrides:
  body-parser: ^2.3.0
  multer: ^2.2.0
  dompurify: ^3.4.13
  postcss: ^8.5.23
  nanoid: ^3.3.18
  tmp: ^0.2.6
  uuid: ^11.1.1
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@3: ^3.0.6
  brace-expansion@5: ^5.0.9

# pnpm 11+: scripts de instalación aprobados explícitamente (allowBuilds).
# core-js solo imprime un banner en postinstall → se desactiva.
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  core-js: false
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true